rubrics:
  - id: 1
    type: f2p
    text: "单个监听器失败时，其他已注册监听器仍得到一次可观察的派发结果。"
  - id: 2
    type: f2p
    text: "失败信息会沿当前信号派发返回或记录，不能被后续监听器静默覆盖。"
  - id: 3
    type: f2p
    text: "取消当前派发后，未开始的监听器不会被伪造为成功。"
  - id: 4
    type: f2p
    text: "同一信号再次派发只运行当前有效监听器，不重复执行已结束的派发任务。"
  - id: 5
    type: f2p
    text: "应用关闭信号能结束正在等待的监听器并完成关闭流程。"
  - id: 6
    type: p2p
    text: "正常信号派发顺序和监听器收到的参数保持不变。"
  - id: 7
    type: p2p
    text: "未注册该信号的应用继续使用原有启动和关闭行为。"
